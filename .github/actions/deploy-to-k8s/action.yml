name: Deploy to homelab k8s
description: >
  Apply an app's own manifests to its namespace on the homelab cluster and wait
  for the rollout. Meant to be called FROM AN APP REPO:

    - uses: SebastianThomas/homelab-infra/.github/actions/deploy-to-k8s@main
      with:
        app: myapp
        image: ghcr.io/sebastianthomas/myapp:${{ github.ref_name }}
        kube-api: ${{ secrets.KUBE_API }}
        kube-ca: ${{ secrets.KUBE_CA }}
        kube-token: ${{ secrets.KUBE_TOKEN }}
        # only when the cluster's public :6443 is closed:
        # tailscale-authkey: ${{ secrets.TS_AUTHKEY }}
        # headscale-url: ${{ secrets.HEADSCALE_URL }}

  The namespace, RBAC (the `deployer` SA whose token this uses), database and
  HTTPRoute are provisioned once by homelab-infra (kubernetes/apps/<app>/).
  Manifests in `path` may reference the literal `${APP_IMAGE}` - it is replaced
  with `image` before apply.

inputs:
  app:
    description: App name = namespace = Deployment name.
    required: true
  image:
    description: Full image ref to deploy (e.g. ghcr.io/me/app:v1.2.3).
    required: true
  path:
    description: Directory in the caller repo holding the manifests (+ optional kustomization.yaml).
    required: false
    default: deploy
  kube-api:
    description: >
      API URL. If the cluster's public :6443 is open, use
      https://homelab.sthomas.ch:6443. If it is firewalled to the tailnet, use
      https://kube-cp-01.ts.homelab.sthomas.ch:6443 and set tailscale-authkey.
    required: true
  kube-ca:
    description: Base64 CA cert (the `ca.crt` value from the deployer-token Secret).
    required: true
  kube-token:
    description: The deployer ServiceAccount token.
    required: true
  tailscale-authkey:
    description: >
      Optional Headscale pre-auth key (reusable + ephemeral). Set it (plus a
      tailnet kube-api) to reach a cluster whose public API port is closed.
    required: false
    default: ""
  headscale-url:
    description: Headscale control server URL (used only with tailscale-authkey).
    required: false
    default: ""
  rollout-timeout:
    required: false
    default: 180s

runs:
  using: composite
  steps:
    - name: Join the Headscale tailnet
      if: inputs.tailscale-authkey != ''
      uses: tailscale/github-action@v4
      with:
        authkey: ${{ inputs.tailscale-authkey }}
        hostname: gha-${{ inputs.app }}
        args: --login-server=${{ inputs.headscale-url }} --accept-dns

    - uses: azure/setup-kubectl@v5

    - name: Write kubeconfig
      shell: bash
      run: |
        umask 077 && mkdir -p ~/.kube
        cat > ~/.kube/config <<EOF
        apiVersion: v1
        kind: Config
        clusters:
          - name: homelab
            cluster:
              server: ${{ inputs.kube-api }}
              certificate-authority-data: ${{ inputs.kube-ca }}
        users:
          - name: deployer
            user:
              token: ${{ inputs.kube-token }}
        contexts:
          - name: homelab
            context: { cluster: homelab, user: deployer, namespace: ${{ inputs.app }} }
        current-context: homelab
        EOF

    - name: Render + apply
      shell: bash
      env:
        APP_IMAGE: ${{ inputs.image }}
        APP: ${{ inputs.app }}
        SRC: ${{ inputs.path }}
        TIMEOUT: ${{ inputs.rollout-timeout }}
      run: |
        set -euo pipefail
        if [ -f "${SRC}/kustomization.yaml" ]; then
          render() { kubectl kustomize "${SRC}"; }
        else
          render() { cat "${SRC}"/*.yaml; }
        fi
        render | envsubst '$APP_IMAGE' | kubectl apply -n "${APP}" -f -
        kubectl -n "${APP}" rollout status "deployment/${APP}" --timeout="${TIMEOUT}"
