name: Set up Ansible
description: >
  Install Python + Ansible + the linters with uv (fast, and it caches the
  resolved wheels across runs, keyed on ansible/requirements.txt).
  community.general / ansible.posix ship inside the `ansible` package, so
  requirements.yml is not installed separately.

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.14"

    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        cache-dependency-glob: ansible/requirements.txt

    - name: Install Ansible + linters
      shell: bash
      run: uv pip install --system -r ansible/requirements.txt
