name: Set up Ansible
description: >
  Install Python + Ansible (and optional extras) with uv, which is ~10x faster
  than pip and caches the resolved wheels across runs. community.general and
  ansible.posix ship inside the full `ansible` package, so no Galaxy step.

inputs:
  extra-packages:
    description: Extra packages, space-separated (e.g. "ansible-lint yamllint").
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        cache-suffix: ansible

    - name: Install Ansible
      shell: bash
      run: uv pip install --system ansible ${{ inputs.extra-packages }}
