name: Configure SSH
description: >
  Write the deploy key and known_hosts. If a Tailscale auth key is supplied,
  also join the Headscale tailnet so the runner can reach the nodes privately
  by their MagicDNS name (kube-cp-01.ts.<domain>).

inputs:
  ssh-private-key:
    description: Private key with access to the nodes.
    required: true
  ssh-known-hosts:
    description: Contents for ~/.ssh/known_hosts (optional).
    required: false
    default: ""
  tailscale-authkey:
    description: >
      Headscale pre-auth key for the runner - reusable + ephemeral, modest expiry:
        headscale preauthkeys create --user <id> --reusable --ephemeral --expiration 8760h
      (not 100y - a headscale upgrade can reject far-future keys.)
      Empty = skip the tailnet (public SSH / public API).
    required: false
    default: ""
  headscale-url:
    description: Headscale control server URL (used only with tailscale-authkey).
    required: false
    default: ""
  tailnet-ping:
    description: >
      MagicDNS name to `tailscale ping` right after joining, as a connectivity
      gate (e.g. "kube-cp-01"). Empty = skip.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Write SSH key + known_hosts
      shell: bash
      run: |
        mkdir -p ~/.ssh && chmod 700 ~/.ssh
        printf '%s\n' "${{ inputs.ssh-private-key }}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        printf '%s\n' "${{ inputs.ssh-known-hosts }}" > ~/.ssh/known_hosts

    # Direct tailscaled + `tailscale up` rather than tailscale/github-action:
    # that action deprecates authkeys for Tailscale-SaaS OAuth (Headscale has no
    # equivalent), and this skips apt's slow `apt update` by using the static
    # tarball. Per-run node name; ephemeral (Headscale drops it on disconnect).
    - name: Join the Headscale tailnet
      if: inputs.tailscale-authkey != ''
      shell: bash
      env:
        TS_AUTHKEY: ${{ inputs.tailscale-authkey }}
        LOGIN_SERVER: ${{ inputs.headscale-url }}
        TS_HOSTNAME: gha-homelab-${{ github.run_id }}-${{ github.run_attempt }}
        PING_TARGET: ${{ inputs.tailnet-ping }}
      run: |
        set -euo pipefail

        if ! command -v tailscale >/dev/null; then
          arch=$(dpkg --print-architecture 2>/dev/null || echo amd64)
          ver=$(curl -fsSL --retry 3 'https://pkgs.tailscale.com/stable/?mode=json' | jq -r .TarballsVersion)
          echo "installing tailscale ${ver} (${arch}) from tarball"
          curl -fsSL --retry 3 "https://pkgs.tailscale.com/stable/tailscale_${ver}_${arch}.tgz" -o /tmp/ts.tgz
          tar -xzf /tmp/ts.tgz -C /tmp
          d="/tmp/tailscale_${ver}_${arch}"
          sudo install -m0755 "$d/tailscale"  /usr/bin/tailscale
          sudo install -m0755 "$d/tailscaled" /usr/sbin/tailscaled
          sudo install -m0644 "$d/systemd/tailscaled.service"  /etc/systemd/system/tailscaled.service
          sudo install -m0644 "$d/systemd/tailscaled.defaults" /etc/default/tailscaled
          sudo mkdir -p /var/lib/tailscale
          sudo systemctl daemon-reload
        fi
        sudo systemctl enable --now tailscaled
        for _ in $(seq 1 20); do [ -S /run/tailscale/tailscaled.sock ] && break; sleep 0.5; done

        # --operator so later `tailscale` CLI calls don't need sudo
        if ! sudo tailscale up \
          --login-server="$LOGIN_SERVER" \
          --authkey="$TS_AUTHKEY" \
          --hostname="$TS_HOSTNAME" \
          --operator="${USER:-runner}" \
          --timeout=120s
        then
          echo "::group::tailscale up failed - diagnostics"
          host=${LOGIN_SERVER#*://}; host=${host%%/*}
          echo "-- does curl reach the SAME endpoint tailscaled times out on?"
          curl -sS -m 10 -o /dev/null -w '  curl /health      -> %{http_code} in %{time_total}s via %{remote_ip}\n' "$LOGIN_SERVER/health" || echo "  curl /health FAILED"
          curl -sS -m 10 -o /dev/null -w '  curl /key?v=142   -> %{http_code} in %{time_total}s via %{remote_ip}\n' "$LOGIN_SERVER/key?v=142" || echo "  curl /key FAILED"
          echo "-- name resolution for $host"
          getent ahosts "$host" || true
          echo "-- sockets to :443"
          ss -tan state all "( dport = :443 )" 2>&1 | head -10 || true
          echo "-- tailscaled"
          ls -l /dev/net/tun 2>&1 || echo "NO /dev/net/tun"
          systemctl --no-pager -l status tailscaled 2>&1 | head -15 || true
          sudo tailscale status 2>&1 || true
          sudo journalctl -u tailscaled --no-pager -n 60 || true
          echo "::endgroup::"
          exit 1
        fi

        [ -n "$PING_TARGET" ] || exit 0
        echo "Waiting for $PING_TARGET over the tailnet..."
        for _ in $(seq 1 30); do
          tailscale ping -c 1 --timeout 3s "$PING_TARGET" >/dev/null 2>&1 && { echo "reachable"; exit 0; }
          sleep 2
        done
        echo "::error::$PING_TARGET not reachable over the tailnet after ~2 min"
        tailscale status || true
        exit 1
