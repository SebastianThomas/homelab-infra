name: Configure SSH
description: >
  Write the deploy key and known_hosts. If a Tailscale auth key is supplied,
  also join the Headscale tailnet so the runner can reach the nodes privately
  by their MagicDNS name (kube-cp-01.ts.<domain>).

inputs:
  ssh-private-key:
    description: Private key with access to the nodes.
    required: true
  ssh-known-hosts:
    description: Contents for ~/.ssh/known_hosts (optional).
    required: false
    default: ""
  tailscale-authkey:
    description: >
      Headscale pre-auth key for the runner - create it reusable + ephemeral
      with a long expiry:
        headscale preauthkeys create --user <id> --reusable --ephemeral --expiration 100y
      Empty = skip the tailnet (public SSH / public API).
    required: false
    default: ""
  headscale-url:
    description: Headscale control server URL (used only with tailscale-authkey).
    required: false
    default: ""
  tailnet-ping:
    description: >
      MagicDNS name to `tailscale ping` right after joining, as a connectivity
      gate (e.g. "kube-cp-01"). Empty = skip.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Write SSH key + known_hosts
      shell: bash
      run: |
        mkdir -p ~/.ssh && chmod 700 ~/.ssh
        printf '%s\n' "${{ inputs.ssh-private-key }}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        printf '%s\n' "${{ inputs.ssh-known-hosts }}" > ~/.ssh/known_hosts

    - name: Join the Headscale tailnet
      if: inputs.tailscale-authkey != ''
      uses: tailscale/github-action@v4
      with:
        authkey: ${{ inputs.tailscale-authkey }}
        # Per-run node name so a queued/overlapping run can't fight over it.
        hostname: gha-homelab-${{ github.run_id }}-${{ github.run_attempt }}
        # --accept-dns so the runner resolves *.ts.<domain> via MagicDNS.
        args: --login-server=${{ inputs.headscale-url }} --accept-dns
        ping: ${{ inputs.tailnet-ping }}
