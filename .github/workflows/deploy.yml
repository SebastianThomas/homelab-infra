name: deploy
run-name: >-
  Deploy: ${{ github.event.head_commit.message || format('{0} @ {1}', github.actor, github.ref_name) }} · production

# Applies kubernetes/ to the cluster (ordered, idempotent). Runs on push to
# main for kubernetes/** and on demand.
on:
  push:
    branches: [main]
    paths:
      - "kubernetes/**"
      - ".github/workflows/deploy.yml"
      - ".github/actions/**"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lint

  kubectl:
    needs: lint
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v5

      # The runner joins the tailnet (TS_AUTHKEY) and reaches the cluster over it.
      # SSH_HOST / KUBE_API must be the tailnet MagicDNS forms:
      #   SSH_HOST = kube-cp-01.ts.homelab.sthomas.ch
      #   KUBE_API = https://kube-cp-01.ts.homelab.sthomas.ch:6443
      - uses: ./.github/actions/setup-ssh
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          tailscale-authkey: ${{ secrets.TS_AUTHKEY }}
          headscale-url: ${{ secrets.HEADSCALE_URL }}
          tailnet-ping: kube-cp-01

      - uses: ./.github/actions/kubeconfig
        with:
          ssh-user: ${{ secrets.ANSIBLE_SSH_USER }}
          ssh-host: ${{ secrets.SSH_HOST }}
          kube-api: ${{ secrets.KUBE_API }}

      - name: Ensure the Headplane secret
        env:
          COOKIE: ${{ secrets.HEADPLANE_COOKIE_SECRET }}
          API_KEY: ${{ secrets.HEADPLANE_API_KEY }}
        run: |
          kubectl create namespace headscale --dry-run=client -o yaml | kubectl apply -f -
          if [ -n "${COOKIE}" ] && [ -n "${API_KEY}" ]; then
            kubectl -n headscale create secret generic headplane-secret \
              --from-literal=cookie_secret="${COOKIE}" \
              --from-literal=api_key="${API_KEY}" \
              --dry-run=client -o yaml | kubectl apply -f -
          else
            echo "::warning::HEADPLANE_COOKIE_SECRET / HEADPLANE_API_KEY not set - Headplane stays NotReady. See kubernetes/infrastructure/headscale/README.md"
          fi

      - name: Sync the Grafana admin secret
        id: grafana_secret
        env:
          GRAFANA_USER: ${{ secrets.GRAFANA_ADMIN_USER }}
          GRAFANA_PASS: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -
          [ -n "${GRAFANA_PASS}" ] || { echo "::notice::GRAFANA_ADMIN_PASSWORD not set - bootstrap.sh generates a random one (read it back per monitoring/README.md)"; exit 0; }
          desired=$(kubectl -n monitoring create secret generic grafana-admin \
            --from-literal=admin-user="${GRAFANA_USER:-admin}" \
            --from-literal=admin-password="${GRAFANA_PASS}" \
            --dry-run=client -o jsonpath='{.data}')
          current=$(kubectl -n monitoring get secret grafana-admin -o jsonpath='{.data}' 2>/dev/null || true)
          if [ "${desired}" = "${current}" ]; then
            echo "grafana-admin unchanged - nothing to do."
            exit 0
          fi
          kubectl -n monitoring create secret generic grafana-admin \
            --from-literal=admin-user="${GRAFANA_USER:-admin}" \
            --from-literal=admin-password="${GRAFANA_PASS}" \
            --dry-run=client -o yaml | kubectl apply -f -
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Ensure the acme-dns secret
        # Full combined JSON: { "<zone>": {username,password,fulldomain,subdomain,allowfrom}, ... }
        # cert-manager reads it for DNS-01 (see infrastructure/cert-manager/cluster-issuer.yaml).
        env:
          ACME_DNS_JSON: ${{ secrets.ACME_DNS_JSON }}
        run: |
          kubectl create namespace cert-manager --dry-run=client -o yaml | kubectl apply -f -
          if [ -n "${ACME_DNS_JSON}" ]; then
            kubectl -n cert-manager create secret generic acme-dns \
              --from-literal=acmedns.json="${ACME_DNS_JSON}" \
              --dry-run=client -o yaml | kubectl apply -f -
          else
            echo "::warning::ACME_DNS_JSON not set - the DNS-01 wildcard cert (gateway-tls) will not issue. See docs/gateway-api.md#tls"
          fi

      - name: Apply infrastructure + apps
        run: kubernetes/bootstrap.sh

      - name: Roll Headplane to pick up the secret
        run: kubectl -n headscale rollout restart deploy/headplane || true

      - name: Apply the new Grafana admin password
        # Only when the Secret actually changed. Grafana keeps its persistent DB
        # (dashboards, folders, tokens) - this is an in-place password reset on
        # the running pod, no restart, nothing else touched. A brand-new DB
        # (first ever run) already has the password from the Secret.
        if: steps.grafana_secret.outputs.changed == 'true'
        env:
          GRAFANA_PASS: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          if kubectl -n monitoring rollout status deploy -l app.kubernetes.io/name=grafana --timeout=120s 2>/dev/null; then
            pod=$(kubectl -n monitoring get pod -l app.kubernetes.io/name=grafana -o jsonpath='{.items[0].metadata.name}')
            kubectl -n monitoring exec "$pod" -c grafana -- \
              grafana cli --homepath /usr/share/grafana admin reset-admin-password "${GRAFANA_PASS}"
          else
            echo "::notice::Grafana not up yet (first run) - it takes the password from the Secret on start."
          fi
