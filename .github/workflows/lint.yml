name: lint
run-name: >-
  Lint: ${{ github.event.head_commit.message || github.head_ref || github.ref_name }}

# PRs only. On push to main, `deploy` / `provision` run the same lint action as
# a gate before applying anything (see .github/actions/lint).
on:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/lint
