---
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
  when: unattended_upgrades_enabled | bool

- name: Configure unattended-upgrades (security-only, scheduled reboot)
  ansible.builtin.template:
    src: 50unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: "0644"
  when: unattended_upgrades_enabled | bool

- name: Enable the daily apt update / unattended-upgrade cycle
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
  when: unattended_upgrades_enabled | bool

# The apt package ships these timers disabled-by-default on some images
# (notably minimal cloud images) even though 20auto-upgrades exists - make
# sure the cycle this all depends on is actually running.
- name: Ensure the apt-daily timers are enabled and running
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer
  when: unattended_upgrades_enabled | bool
