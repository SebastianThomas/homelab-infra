---
# Worker (k3s agent) defaults. Real values: group_vars/all/main.yml + the
# per-host block in inventory/hosts.yml (node_ip, node_labels, node_taints,
# tailscale_exit_node).
#
# The agent joins `https://{{ k3s_cp_tailscale_ip }}:{{ k3s_api_port }}` over
# the tailnet (kube-cp-01's public :6443 is firewalled). Per-node resolv.conf
# is left to the OS - override with `k3s_resolv_conf_manage: false` in the
# host block if the node isn't the VPS.
