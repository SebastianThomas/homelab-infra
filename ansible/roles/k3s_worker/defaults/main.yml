---
# API endpoint the agent joins through. With the VPN substrate enabled this is
# the server's tailnet IP (k3s_cp_tailscale_ip); otherwise its public address.
k3s_worker_server: >-
  https://{{ k3s_cp_tailscale_ip
  if (k3s_enable_vpn | bool and k3s_cp_tailscale_ip)
  else hostvars[groups['k3s_cp'][0]].ansible_host }}:{{ k3s_api_port }}
