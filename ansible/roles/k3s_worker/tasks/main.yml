---
- name: Require the node to be on the tailnet already
  ansible.builtin.assert:
    that:
      - "'tailscale0' in ansible_facts.interfaces"
      - k3s_cp_tailscale_ip | length > 0
    fail_msg: >-
      This node joins over the Headscale tailnet but has no tailscale0 interface.
      Run `tailscale up --login-server={{ k3s_headscale_url }} --authkey=<key>`
      on it first (one-time, manual). See README "Adding a worker node".
    success_msg: "On the tailnet - proceeding with the agent install."

- name: Require node_ip (this node's tailnet address) to be set in the inventory
  ansible.builtin.assert:
    that:
      - node_ip | default('') | length > 0
    fail_msg: >-
      Set `node_ip:` for {{ inventory_hostname }} in inventory/hosts.yml to its
      tailnet IP (`tailscale ip -4` on the node) so the apiserver can reach the
      kubelet for `kubectl logs` / `exec`.
    success_msg: "node_ip = {{ node_ip }}"

# --- Raspberry Pi / Ubuntu prerequisites the kubelet needs -----------------
- name: Raspberry Pi prerequisites
  when: ansible_facts.architecture == "aarch64"
  block:
    - name: Ensure vxlan / br_netfilter etc. are available (flannel needs them)
      ansible.builtin.apt:
        name: linux-modules-extra-raspi
        state: present
      failed_when: false      # only exists on the raspi kernel; built in elsewhere

    - name: Load the vxlan module now
      community.general.modprobe:
        name: vxlan
        state: present
      failed_when: false

    - name: Read the kernel cmdline
      ansible.builtin.slurp:
        src: /boot/firmware/cmdline.txt
      register: k3s_worker_cmdline_raw

    - name: Enable the memory + cpuset cgroup controllers on the kernel cmdline
      ansible.builtin.copy:
        dest: /boot/firmware/cmdline.txt
        owner: root
        group: root
        mode: "0755"
        content: "{{ k3s_worker_cmdline_raw.content | b64decode | trim }} cgroup_enable=cpuset cgroup_enable=memory cgroup_memory=1\n"
      when: >-
        'cgroup_enable=memory' not in (k3s_worker_cmdline_raw.content | b64decode)
      register: k3s_worker_cmdline

    - name: Reboot for the cgroup cmdline change (one-time)
      ansible.builtin.reboot:
        reboot_timeout: 300
      when: k3s_worker_cmdline is defined and k3s_worker_cmdline is changed

- name: Create the K3s config directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0755"      # k3s default; secrets are protected by config.yaml's 0600

- name: Write the K3s upstream resolv.conf
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/resolv.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible - roles/k3s_worker. Kubernetes honours only 3 nameservers.
      {% for ns in k3s_resolvers %}
      nameserver {{ ns }}
      {% endfor %}
  when: k3s_resolv_conf_manage | bool
  notify: Restart k3s-agent

- name: Write the K3s agent config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0600"
  notify: Restart k3s-agent

- name: Create the k3s-agent systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/k3s-agent.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Gate k3s-agent on the tailscale0 interface (flannel-iface rides it)
  ansible.builtin.copy:
    dest: /etc/systemd/system/k3s-agent.service.d/20-tailscale.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible - roles/k3s_worker. flannel-iface = tailscale0.
      [Unit]
      After=tailscaled.service
      Wants=tailscaled.service
      [Service]
      ExecStartPre=/bin/sh -c 'for i in $(seq 1 90); do ip -4 addr show tailscale0 2>/dev/null | grep -q "inet " && exit 0; sleep 1; done; echo "tailscale0 has no IPv4 after 90s" >&2; exit 1'
  when: k3s_flannel_iface == "tailscale0"
  notify: Restart k3s-agent

# The kubelet client cert is issued for `system:node:<name>`. If the agent first
# registered under the wrong name (fresh Pi hostname, e.g. "pi4"), a node-name
# change alone is rejected by the Node authorizer - the local state has to go so
# it bootstraps a fresh cert.
- name: Is this host registered under its inventory name?
  ansible.builtin.command: "k3s kubectl get node {{ inventory_hostname }}"
  delegate_to: "{{ groups['k3s_cp'][0] }}"
  become: true
  register: k3s_worker_registered
  changed_when: false
  failed_when: false

- name: Look for an already-bootstrapped local agent
  ansible.builtin.stat:
    path: /var/lib/rancher/k3s/agent/kubelet.kubeconfig
  register: k3s_worker_agent_state

- name: Reset stale agent state (registered under a different node name)
  when:
    - k3s_worker_agent_state.stat.exists
    - k3s_worker_registered.rc != 0
  block:
    - name: Stop k3s-agent
      ansible.builtin.systemd:
        name: k3s-agent
        state: stopped
      failed_when: false

    - name: Wipe /var/lib/rancher/k3s/agent (forces a clean re-register)
      ansible.builtin.file:
        path: /var/lib/rancher/k3s/agent
        state: absent

- name: Download the K3s install script
  ansible.builtin.get_url:
    url: "{{ k3s_install_script_url }}"
    dest: "{{ k3s_install_script_path }}"
    owner: root
    group: root
    mode: "0755"

- name: Check the installed K3s version
  ansible.builtin.command: k3s --version
  register: k3s_worker_installed
  changed_when: false
  failed_when: false

- name: Install / upgrade the K3s agent
  ansible.builtin.command: "{{ k3s_install_script_path }}"
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: "agent"
  when: >-
    k3s_worker_installed.rc != 0
    or k3s_version not in k3s_worker_installed.stdout

- name: Ensure the k3s-agent service is enabled and started
  ansible.builtin.systemd:
    name: k3s-agent
    enabled: true
    state: started
    daemon_reload: true

- name: Apply pending restarts
  ansible.builtin.meta: flush_handlers

- name: Wait for the worker to report Ready (checked from the control plane)
  ansible.builtin.command: "k3s kubectl get node {{ inventory_hostname }} --no-headers"
  delegate_to: "{{ groups['k3s_cp'][0] }}"
  become: true
  register: k3s_worker_ready
  until: k3s_worker_ready.rc == 0 and k3s_worker_ready.stdout.split()[1:2] == ["Ready"]
  retries: 30
  delay: 10
  changed_when: false

- name: Drop stale node objects for this host (old name, same tailnet IP)
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      k3s kubectl get nodes -o json
      | jq -r --arg me '{{ inventory_hostname }}' --arg ip '{{ node_ip }}'
        '.items[] | select(.metadata.name != $me)
         | select([.status.addresses[]?.address] | index($ip))
         | .metadata.name'
      | xargs -r k3s kubectl delete node --ignore-not-found
  delegate_to: "{{ groups['k3s_cp'][0] }}"
  become: true
  register: k3s_worker_stale
  changed_when: "'deleted' in k3s_worker_stale.stdout"

- name: Give the login user a kubeconfig (API over the tailnet)
  when:
    - k3s_worker_user_kubeconfig | bool
    - ansible_user != "root"
  block:
    - name: Read the kubeconfig from the control plane
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      delegate_to: "{{ groups['k3s_cp'][0] }}"
      become: true
      register: k3s_worker_cp_kubeconfig

    - name: Look up the login user's home directory
      ansible.builtin.getent:
        database: passwd
        key: "{{ ansible_user }}"

    - name: Ensure ~/.kube exists for {{ ansible_user }}
      ansible.builtin.file:
        path: "{{ ansible_facts.getent_passwd[ansible_user][4] }}/.kube"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0700"

    - name: Install ~/.kube/config pointing at the CP's tailnet address
      ansible.builtin.copy:
        dest: "{{ ansible_facts.getent_passwd[ansible_user][4] }}/.kube/config"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"
        content: >-
          {{ k3s_worker_cp_kubeconfig.content | b64decode
             | replace('https://127.0.0.1:6443',
                       'https://' ~ k3s_cp_tailscale_ip ~ ':' ~ k3s_api_port) }}
