---
- name: Require the node to be on the tailnet already
  ansible.builtin.assert:
    that:
      - "'tailscale0' in ansible_interfaces"
      - k3s_cp_tailscale_ip | length > 0
    fail_msg: >-
      This node joins over the Headscale tailnet but has no tailscale0 interface.
      Run `tailscale up --login-server={{ k3s_headscale_url }} --authkey=<key>`
      on it first (one-time, manual). See README "Adding a worker node".
    success_msg: "On the tailnet - proceeding with the agent install."

- name: Require node_ip (this node's tailnet address) to be set in the inventory
  ansible.builtin.assert:
    that:
      - node_ip | default('') | length > 0
    fail_msg: >-
      Set `node_ip:` for {{ inventory_hostname }} in inventory/hosts.yml to its
      tailnet IP (`tailscale ip -4` on the node) so the apiserver can reach the
      kubelet for `kubectl logs` / `exec`.
    success_msg: "node_ip = {{ node_ip }}"

- name: Create the K3s config directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0755"      # k3s default; secrets are protected by config.yaml's 0600

- name: Write the K3s upstream resolv.conf
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/resolv.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible - roles/k3s_worker. Kubernetes honours only 3 nameservers.
      {% for ns in k3s_resolvers %}
      nameserver {{ ns }}
      {% endfor %}
  when: k3s_resolv_conf_manage | bool
  notify: Restart k3s-agent

- name: Write the K3s agent config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0600"
  notify: Restart k3s-agent

- name: Create the k3s-agent systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/k3s-agent.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Order k3s-agent after tailscaled (flannel-iface = tailscale0 must exist at start)
  ansible.builtin.copy:
    dest: /etc/systemd/system/k3s-agent.service.d/20-tailscale.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible - roles/k3s_worker
      [Unit]
      After=tailscaled.service
      Wants=tailscaled.service
  when: k3s_flannel_iface == "tailscale0"
  notify: Restart k3s-agent

- name: Download the K3s install script
  ansible.builtin.get_url:
    url: "{{ k3s_install_script_url }}"
    dest: "{{ k3s_install_script_path }}"
    owner: root
    group: root
    mode: "0755"

- name: Check the installed K3s version
  ansible.builtin.command: k3s --version
  register: k3s_worker_installed
  changed_when: false
  failed_when: false

- name: Install / upgrade the K3s agent
  ansible.builtin.command: "{{ k3s_install_script_path }}"
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: "agent"
  when: >-
    k3s_worker_installed.rc != 0
    or k3s_version not in k3s_worker_installed.stdout

- name: Ensure the k3s-agent service is enabled and started
  ansible.builtin.systemd:
    name: k3s-agent
    enabled: true
    state: started
    daemon_reload: true

- name: Apply pending restarts
  ansible.builtin.meta: flush_handlers

- name: Wait for the worker to report Ready (checked from the control plane)
  ansible.builtin.command: "k3s kubectl get node {{ inventory_hostname }} --no-headers"
  delegate_to: "{{ groups['k3s_cp'][0] }}"
  become: true
  register: k3s_worker_ready
  until: k3s_worker_ready.rc == 0 and k3s_worker_ready.stdout.split()[1:2] == ["Ready"]
  retries: 30
  delay: 10
  changed_when: false
