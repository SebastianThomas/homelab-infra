---
- name: Create the K3s config directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0755"      # k3s default; secrets are protected by config.yaml's 0600

- name: Write the K3s upstream resolv.conf
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/resolv.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible - roles/k3s_cp. Kubernetes honours only 3 nameservers.
      {% for ns in k3s_resolvers %}
      nameserver {{ ns }}
      {% endfor %}
  when: k3s_resolv_conf_manage | bool
  notify: Restart k3s

- name: Write the K3s server config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0600"
  notify: Restart k3s

# Graceful node shutdown: the kubelet terminates pods (regular, then critical)
# before releasing the shutdown, so `reboot` is a clean stop for CNPG / Headscale
# instead of a SIGKILL. Pulled in by the `config=` kubelet-arg in config.yaml;
# kept minimal because k3s passes everything else as flags, which override it.
- name: Write the kubelet config
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/kubelet.config
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible - roles/k3s_cp.
      apiVersion: kubelet.config.k8s.io/v1beta1
      kind: KubeletConfiguration
      shutdownGracePeriod: {{ k3s_shutdown_grace_period }}
      shutdownGracePeriodCriticalPods: {{ k3s_shutdown_grace_period_critical_pods }}
  notify: Restart k3s

- name: Create the k3s systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/k3s.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the crash-loop hardening drop-in
  ansible.builtin.copy:
    dest: /etc/systemd/system/k3s.service.d/10-startlimit.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible - roles/k3s_cp
      # Fail fast instead of crash-looping the API server forever.
      [Unit]
      StartLimitIntervalSec=300
      StartLimitBurst=5
  notify: Restart k3s

- name: Order k3s after the pod-mesh interface (flannel-iface rides it)
  ansible.builtin.copy:
    dest: /etc/systemd/system/k3s.service.d/20-podmesh.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible - roles/k3s_cp. flannel-iface = {{ k3s_flannel_iface }};
      # wg-quick@{{ k3s_flannel_iface }} (oneshot) brings it up before k3s. No
      # wait loop - wg0 is a static kernel interface, not a tunnel that must
      # reach a control server first (that was the flannel-over-tailscale deadlock).
      [Unit]
      After=wg-quick@{{ k3s_flannel_iface }}.service
      Wants=wg-quick@{{ k3s_flannel_iface }}.service
  when: k3s_flannel_iface | length > 0
  notify: Restart k3s

- name: Remove the pod-mesh k3s drop-in on a single-node cluster
  ansible.builtin.file:
    path: /etc/systemd/system/k3s.service.d/20-podmesh.conf
    state: absent
  when: k3s_flannel_iface | length == 0
  notify: Restart k3s

# flannel over wg0 gives a small pod MTU; the klipper -> Traefik ingress path
# then black-holes large packets (a tailscale ClientHello) because the ICMP
# "frag needed" is lost in klipper's NAT. Clamp forwarded TCP MSS to the pod
# MTU so no segment is ever too big. See the script header.
- name: Install the pod-network MSS clamp
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { src: pod-mss-clamp, dest: /usr/local/sbin/pod-mss-clamp, mode: "0755" }
    - { src: pod-mss-clamp.service, dest: /etc/systemd/system/pod-mss-clamp.service, mode: "0644" }
    - { src: pod-mss-clamp.timer, dest: /etc/systemd/system/pod-mss-clamp.timer, mode: "0644" }
  loop_control:
    label: "{{ item.dest }}"

- name: Enable the MSS clamp at boot + its safety-net timer
  ansible.builtin.systemd:
    name: "{{ item.name }}"
    enabled: true
    state: "{{ item.state }}"
    daemon_reload: true
  loop:
    - { name: pod-mss-clamp.timer, state: started }
    # oneshot: `restarted` re-asserts the rule on every provision run
    - { name: pod-mss-clamp.service, state: restarted }
  loop_control:
    label: "{{ item.name }}"

- name: Download the K3s install script
  ansible.builtin.get_url:
    url: "{{ k3s_install_script_url }}"
    dest: "{{ k3s_install_script_path }}"
    owner: root
    group: root
    mode: "0755"

- name: Check the installed K3s version
  ansible.builtin.command: k3s --version
  register: k3s_cp_installed
  changed_when: false
  failed_when: false

- name: Install / upgrade the K3s server
  ansible.builtin.command: "{{ k3s_install_script_path }}"
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: "server"
  when: >-
    k3s_cp_installed.rc != 0
    or k3s_version not in k3s_cp_installed.stdout
  # The installer runs daemon-reload and (re)starts the service itself.

- name: Ensure the k3s service is enabled and started
  ansible.builtin.systemd:
    name: k3s
    enabled: true
    state: started
    daemon_reload: true

- name: Apply pending restarts before waiting for readiness
  ansible.builtin.meta: flush_handlers

- name: Wait for the control-plane node to report Ready
  ansible.builtin.command: "k3s kubectl get node {{ inventory_hostname }} --no-headers"
  register: k3s_cp_ready
  until: k3s_cp_ready.rc == 0 and k3s_cp_ready.stdout.split()[1:2] == ["Ready"]
  retries: 30
  delay: 10
  changed_when: false

- name: Give the login user a kubeconfig (~/.kube/config on the node)
  when:
    - k3s_cp_user_kubeconfig | bool
    - ansible_user != "root"
  block:
    - name: Look up the login user's home directory
      ansible.builtin.getent:
        database: passwd
        key: "{{ ansible_user }}"

    - name: Ensure ~/.kube exists for {{ ansible_user }}
      ansible.builtin.file:
        path: "{{ ansible_facts.getent_passwd[ansible_user][4] }}/.kube"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0700"

    - name: Install k3s.yaml as ~/.kube/config
      ansible.builtin.copy:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ ansible_facts.getent_passwd[ansible_user][4] }}/.kube/config"
        remote_src: true
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"

- name: Fetch the kubeconfig back to the Ansible controller
  when: k3s_cp_fetch_kubeconfig | bool
  block:
    - name: Read the kubeconfig from the server
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: k3s_cp_kubeconfig

    - name: Ensure the local kubeconfig directory exists
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../kubeconfig"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    - name: Save the kubeconfig locally with a reachable API address
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../kubeconfig/{{ inventory_hostname }}.yaml"
        mode: "0600"
        content: >-
          {{ k3s_cp_kubeconfig.content | b64decode
             | replace('https://127.0.0.1:6443', k3s_cp_kubeconfig_server) }}
      delegate_to: localhost
      become: false
