---
# ufw rules for the public K3s server. Applied when firewall_enabled is true.
#
# NOTE: community.general.ufw is not declarative - it adds/deletes individual
# rules and never reconciles a desired-state list. To *remove* a rule you used
# to have, put it in firewall_absent_rules (deleted before the allow rules).

firewall_allow_rules:
  - { port: 22, proto: tcp, comment: "SSH" }
  - { port: 80, proto: tcp, comment: "HTTP (Traefik - redirects to HTTPS)" }
  - { port: 443, proto: tcp, comment: "HTTPS (Traefik)" }
  # WireGuard pod-mesh link: the Pi dials in here. Keep in sync with
  # wg_listen_port (group_vars/all/main.yml).
  - { port: 51820, proto: udp, comment: "WireGuard pod-mesh link" }
  # The Kubernetes API (6443) is reachable only over the tailnet / pod mesh -
  # see firewall_trusted_ifaces. Add it back here as `{ port: 6443, proto: tcp }`
  # if you ever need public API access again.

# Rules to delete if present (formerly-public ports that are now tailnet-only).
firewall_absent_rules:
  - { port: 6443, proto: tcp }

# Trust everything arriving on these interfaces - each is an authenticated,
# encrypted mesh:
#   tailscale0 - the admin tailnet (your laptop, CI, kubectl, SSH)
#   wg0        - the pod-mesh link (inter-node flannel/VXLAN + the worker's
#                API join over :6443)
# Set to [] to skip (e.g. a single node not on either mesh).
firewall_trusted_ifaces:
  - tailscale0
  - wg0

firewall_default_incoming: deny
firewall_default_outgoing: allow
