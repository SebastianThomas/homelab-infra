---
# Overridable defaults. Real values come from group_vars/all/main.yml.
common_timezone: "UTC"
common_packages:
  - curl
  - ca-certificates
  - gnupg
common_apt_upgrade: false
common_disable_swap: true

# Manage /etc/hosts with an entry for every inventory host so nodes resolve
# each other by name.
common_manage_etc_hosts: true

# Load the wireguard kernel module - the wg0 pod-mesh link (roles/wireguard)
# needs it. Harmless if unused.
common_load_wireguard: true
