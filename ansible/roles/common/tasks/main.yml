---
- name: Set the system hostname to the inventory name
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Look for cloud-init
  ansible.builtin.stat:
    path: /etc/cloud/cloud.cfg.d
  register: common_cloud_init_dir

- name: Stop cloud-init from resetting the hostname on reboot
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg.d/99-preserve-hostname.cfg
    owner: root
    group: root
    mode: "0644"
    content: "preserve_hostname: true\n"
  when: common_cloud_init_dir.stat.exists

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade installed packages
  ansible.builtin.apt:
    upgrade: safe
  when: common_apt_upgrade | bool

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Read the current timezone
  ansible.builtin.command: timedatectl show --property=Timezone --value
  register: common_current_tz
  changed_when: false

- name: Set the timezone
  ansible.builtin.command: "timedatectl set-timezone {{ common_timezone }}"
  when: common_current_tz.stdout | trim != common_timezone
  changed_when: true

# --- Swap ---------------------------------------------------------------
- name: Disable swap now
  ansible.builtin.command: swapoff --all
  when:
    - common_disable_swap | bool
    - ansible_facts.swaptotal_mb | default(0) | int > 0
  changed_when: true

- name: Comment out swap entries in /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'
  when: common_disable_swap | bool

# --- Cluster name resolution ------------------------------------------
- name: Maintain /etc/hosts entries for every cluster node
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE MANAGED - homelab cluster nodes"
    block: |
      {% for h in groups['all'] | sort %}
      {{ hostvars[h].ansible_host | default(h) }} {{ h }}
      {% endfor %}
  when: common_manage_etc_hosts | bool

# --- Kernel modules --------------------------------------------------
- name: Ensure the wireguard module loads at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/wireguard.conf
    content: "wireguard\n"
    owner: root
    group: root
    mode: "0644"
  when: common_load_wireguard | bool

- name: Load the wireguard module now (if not already present)
  ansible.builtin.command: modprobe wireguard
  changed_when: false
  failed_when: false          # built-in on some kernels, or loaded at boot; not fatal
  when: common_load_wireguard | bool

# --- Tailscale --------------------------------------------------------
# Every node meshes over the tailnet (k3s_flannel_iface = tailscale0). Both the
# package install and the `tailscale up` that joins Headscale are MANUAL,
# one-time, per node (needs an interactive key + console/LAN access - see the
# README "Adding a worker node"). Opt a host into Ansible managing the package
# with `tailscale_manage_install: true`.
- name: Ensure Tailscale is installed
  when: tailscale_manage_install | default(false) | bool
  block:
    - name: Add the Tailscale apt signing key
      ansible.builtin.get_url:
        url: "https://pkgs.tailscale.com/stable/{{ ansible_facts.distribution | lower }}/{{ ansible_facts.distribution_release }}.noarmor.gpg"
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        owner: root
        group: root
        mode: "0644"

    - name: Add the Tailscale apt repository
      ansible.builtin.get_url:
        url: "https://pkgs.tailscale.com/stable/{{ ansible_facts.distribution | lower }}/{{ ansible_facts.distribution_release }}.tailscale-keyring.list"
        dest: /etc/apt/sources.list.d/tailscale.list
        owner: root
        group: root
        mode: "0644"
      register: common_tailscale_repo

    - name: Refresh apt cache after adding the Tailscale repo
      ansible.builtin.apt:
        update_cache: true
      when: common_tailscale_repo is changed

    - name: Install tailscale
      ansible.builtin.apt:
        name: tailscale
        state: present

    - name: Enable and start tailscaled
      ansible.builtin.systemd:
        name: tailscaled
        enabled: true
        state: started

# --- flannel-over-tailscale plumbing (k3s_flannel_iface = tailscale0) -------
# k3s rides tailscale0, so the interface must exist before k3s starts, and a lost
# control connection has to heal on its own (it once stalled ~2.5h). Two guards:
# wait-tailscale0 (ExecStartPre on k3s / k3s-agent) and a watchdog timer.
- name: Flannel-over-tailscale guards
  when: k3s_flannel_iface | default('') == "tailscale0"
  block:
    - name: Install the wait-for-tailscale0 helper (k3s/k3s-agent ExecStartPre)
      ansible.builtin.copy:
        dest: /usr/local/bin/wait-tailscale0
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/sh
          # Managed by Ansible - roles/common
          n=0
          until ip -4 addr show tailscale0 2>/dev/null | grep -q inet; do
            n=$((n + 1))
            [ "$n" -ge 90 ] && { echo "tailscale0 has no IPv4 after 90s" >&2; exit 1; }
            sleep 1
          done

    - name: Install the tailscaled watchdog
      ansible.builtin.copy:
        dest: /usr/local/bin/tailscaled-watchdog
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/sh
          # Managed by Ansible - roles/common.
          # Restart tailscaled when it has lost its session with the control server.
          #
          # Headscale's node list is authoritative and runs on the control plane,
          # so ask it there. Self.Online is only a fallback: it can report true
          # while headscale has already dropped the session.
          #
          # A restart drops CI's SSH and remote kubectl, so it is rate limited to
          # $threshold consecutive bad checks and one restart per $cooldown.
          # Inconclusive checks exit without touching the counter.
          set -eu

          state=/run/tailscaled-watchdog.fails        # /run is tmpfs: resets on boot
          stamp=/run/tailscaled-watchdog.last-restart
          threshold=3
          cooldown=1800

          systemctl is-active --quiet tailscaled || exit 0
          bad=""
          {% if inventory_hostname in groups['k3s_cp'] %}
          nodes=$(k3s kubectl -n headscale exec deploy/headscale -- \
                    headscale nodes list --output json 2>/dev/null) || exit 0
          online=$(printf '%s' "$nodes" | jq -r --arg me '{{ inventory_hostname }}' \
                     'map(select(.given_name == $me)) | .[0].online // empty') || exit 0
          [ -n "$online" ] || exit 0
          if [ "$online" = "false" ]; then
            bad="headscale has no session for {{ inventory_hostname }}"
          fi
          {% else %}
          online=$(tailscale status --json 2>/dev/null | jq -r '.Self.Online // empty') || exit 0
          [ -n "$online" ] || exit 0
          if [ "$online" = "false" ]; then
            bad="tailscaled reports itself offline"
          fi
          {% endif %}

          if [ -z "$bad" ]; then
            rm -f "$state"
            exit 0
          fi

          fails=$(( $(cat "$state" 2>/dev/null || echo 0) + 1 ))
          echo "$fails" > "$state"
          [ "$fails" -ge "$threshold" ] || exit 0

          now=$(date +%s)
          if [ $(( now - $(cat "$stamp" 2>/dev/null || echo 0) )) -lt "$cooldown" ]; then
            logger -t tailscaled-watchdog "$bad - in cooldown, not restarting"
            exit 0
          fi

          logger -t tailscaled-watchdog "$bad (x$fails) - restarting tailscaled"
          echo "$now" > "$stamp"
          rm -f "$state"
          systemctl restart tailscaled

    - name: Tailscaled watchdog unit + timer
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item.name }}"
        owner: root
        group: root
        mode: "0644"
        content: "{{ item.content }}"
      loop:
        - name: tailscaled-watchdog.service
          content: |
            [Unit]
            Description=Restart tailscaled if it drops off the control server
            [Service]
            Type=oneshot
            ExecStart=/usr/local/bin/tailscaled-watchdog
        - name: tailscaled-watchdog.timer
          content: |
            [Unit]
            Description=Run the tailscaled watchdog periodically
            [Timer]
            OnBootSec=5min
            OnUnitActiveSec=5min
            [Install]
            WantedBy=timers.target
      loop_control:
        label: "{{ item.name }}"

    - name: Enable the tailscaled watchdog timer
      ansible.builtin.systemd:
        name: tailscaled-watchdog.timer
        enabled: true
        state: started
        daemon_reload: true

# --- Tailscale exit node (per host: tailscale_exit_node: true) ----------
# Route tailnet clients' traffic out through this node. Needs the node already
# on the tailnet. Route approval (headscale nodes approve-routes -r 0.0.0.0/0,::/0)
# and client selection (tailscale set --exit-node=<node>) stay manual.
- name: Tailscale exit node
  when:
    - tailscale_exit_node | default(false) | bool
    - "'tailscale0' in ansible_facts.interfaces"
  block:
    - name: Enable IP forwarding for the exit node
      ansible.posix.sysctl:
        name: "{{ item }}"
        value: "1"
        sysctl_file: /etc/sysctl.d/99-tailscale.conf
        sysctl_set: true
        reload: true
      loop:
        - net.ipv4.ip_forward
        - net.ipv6.conf.all.forwarding

    - name: Read current Tailscale prefs
      ansible.builtin.command: tailscale debug prefs
      register: common_ts_prefs
      changed_when: false

    - name: Advertise the exit node
      ansible.builtin.command: tailscale set --advertise-exit-node
      when: >-
        '0.0.0.0/0' not in
        ((common_ts_prefs.stdout | from_json).AdvertiseRoutes | default([]))

    # NO `ethtool -K <nic> rx-udp-gro-forwarding on`. Tailscale suggests it for
    # exit-node throughput, but on the VPS's virtio NIC it corrupts *forwarded*
    # traffic - external clients could reach the host (SSH, tiny GETs) but not
    # anything routed on to a pod (headscale /key, app ingress). Undo any
    # earlier attempt.
    - name: Remove the UDP-GRO tuning unit if it was ever installed
      ansible.builtin.systemd:
        name: tailscale-udp-gro.service
        enabled: false
        state: stopped
      failed_when: false

    - name: Delete the UDP-GRO tuning unit file
      ansible.builtin.file:
        path: /etc/systemd/system/tailscale-udp-gro.service
        state: absent
