[defaults]
inventory            = inventory/hosts.yml
roles_path           = roles
interpreter_python   = auto_silent
retry_files_enabled  = False
force_color          = True

# Run notified handlers even when the play aborts. Without this, a run that
# rewrites /etc/rancher/k3s/config.yaml and then dies before flush_handlers
# loses the "Restart k3s" / "Restart k3s-agent" it queued - and every later run
# sees the file already correct, reports `ok`, and never notifies again. The
# service then keeps running its old config indefinitely, with nothing to show
# for it. (Cost me a NotReady worker on 2026-09-07.)
force_handlers       = True
# Homelab convenience: accept host keys on first connect. For stricter setups,
# provide a known_hosts file instead (CI passes one via SSH_KNOWN_HOSTS) and set
# this back to True.
host_key_checking    = False

# Vault password:
#   local : ansible-playbook ... --ask-vault-pass
#           or set   vault_password_file = .vault_pass   (git-ignored)
#   CI    : --vault-password-file <(printf '%s' "$ANSIBLE_VAULT_PASSWORD")

[privilege_escalation]
become        = True
become_method = sudo
become_user   = root

[ssh_connection]
pipelining = True
# Reuse SSH connections; speeds up multi-task runs.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
