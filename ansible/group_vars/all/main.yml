---
# ===========================================================================
# Cluster-wide, non-secret variables.
#
# Secrets live in group_vars/all/vault.yml (git-ignored): CI writes it from
# GitHub Environment secrets; locally you create it with ansible-vault. See
# vault.example.yml.
# ===========================================================================

# --- K3s ------------------------------------------------------------------
# Pin an exact release. Releases: https://github.com/k3s-io/k3s/releases
# NEVER use a channel ("stable"/"latest") - re-runs must be reproducible.
# To upgrade: bump this and re-run site.yml (servers first, one minor at a time).
# renovate: datasource=github-releases depName=k3s-io/k3s
k3s_version: "v1.36.4+k3s1"

k3s_api_port: 6443

# Kubernetes honours only 3 nameservers; the Strato VPS lists more in
# /etc/resolv.conf, which makes the kubelet log "Nameserver limits exceeded"
# every ~90s. Hand K3s (kubelet + CoreDNS upstream) its own short list instead.
k3s_resolv_conf_manage: true
k3s_resolvers:
  - 212.227.123.16     # Strato recursive resolvers - same DC, no rate limits
  - 212.227.123.17
  - 1.1.1.1            # public fallback

# --- Identity / DNS -----------------------------------------------------
# The one public name that resolves to the VPS. Sub-labels
# (headscale.<domain>, <app>.<domain>) are CNAMEd onto it.
cluster_domain: "homelab.sthomas.ch"

# Prefix for Kubernetes node labels / taints we manage.
homelab_label_domain: "homelab.sthomas.ch"

# The Kubernetes API is reachable only over the tailnet (public :6443 is
# firewalled off). Fetched kubeconfigs point here. For a first-ever bootstrap
# (no tailnet yet) comment this out so it falls back to the public name.
#
# This is ADMIN-plane access only (your kubectl, CI runners). It is NOT how the
# worker joins the cluster - that rides the WireGuard pod-mesh link (see below),
# so a headscale outage never stops the cluster from forming.
k3s_cp_kubeconfig_server: "https://kube-cp-01.ts.{{ cluster_domain }}:6443"

# K3s install script - shared by the k3s_cp and k3s_worker roles.
k3s_install_script_url: "https://get.k3s.io"
k3s_install_script_path: "/usr/local/bin/k3s-install.sh"

# --- Base OS (common role) --------------------------------------------
common_timezone: "Europe/Zurich"
common_packages:
  - curl
  - ca-certificates
  - gnupg
  - vim
  - htop
  - jq
common_apt_upgrade: true
common_disable_swap: true

# --- Firewall (firewall role, VPS only) ------------------------------
firewall_enabled: true

# --- Multi-node: pod mesh over a dedicated WireGuard link -----------------
# The Pi worker is behind NAT, so the nodes cannot reach each other on a LAN.
# A plain point-to-point WireGuard interface (`wg0`, the `wireguard` role)
# carries the pod mesh: kube-cp-01 is the hub (public IP, listens), the Pi is a
# spoke that dials out and holds the tunnel open with a keepalive.
#
# Why not ride the Headscale tailnet (as this once did): headscale runs as a
# Pod *in this cluster*, and tailscaled cannot address tailscale0 until it
# reaches its control server - so gating k3s on tailscale0 deadlocked every
# kube-cp-01 boot (k3s waits for tailscale0 -> needs headscale -> needs k3s).
# `wg0` is a static kernel interface: it is up before k3s with nothing to wait
# for. The tailnet is now admin-plane only (kubectl, CI, SSH, the Pi exit node,
# MagicDNS, the Grafana tailnet node).

# flannel's host interface. "wg0" puts the VXLAN endpoints on the nodes'
# pod-mesh addresses (wg_ip, below); "" uses the default-route iface
# (single-node only, no worker). k3s is ordered After=wg-quick@wg0.
k3s_flannel_iface: "wg0"

# The WireGuard pod-mesh link (the `wireguard` role builds /etc/wireguard/wg0.conf).
wg_pod_mesh_subnet: "10.10.0.0/24"   # tunnel-only; must not clash with a node LAN
wg_listen_port: 51820                # UDP, opened on the hub's public firewall
wg_keepalive: 25                     # seconds; spokes -> hub, to punch out through NAT
wg_mtu: 1280                         # safe floor through the Pi's NAT + OpenVPN

# kube-cp-01's pod-mesh (wg0) IP - the address the worker sets as its K3s
# `server:` (https://<ip>:{{ k3s_api_port }}) and a SAN on the API cert. Per-node
# wg0 IPs (incl. this one) are `wg_ip` in inventory/hosts.yml.
k3s_cp_wg_ip: "10.10.0.1"

# Headscale control server the nodes' Tailscale authenticates against (admin
# plane: your `tailscale up`, CI runners, the Pi's exit-node advertisement).
k3s_headscale_url: "https://headscale.{{ cluster_domain }}"

# kube-cp-01's tailnet IP - a SAN on the API cert and where fetched kubeconfigs
# point, so `kubectl` works over the tailnet. Not used by the worker's join.
k3s_cp_tailscale_ip: "100.64.0.2"

# Per-host (inventory): `tailscale_exit_node: true` advertises that node as a
# Tailscale exit node (IP forwarding on + `tailscale set --advertise-exit-node`).
# Approve the routes once in Headscale/Headplane:
#   headscale nodes approve-routes -i <id> -r 0.0.0.0/0,::/0
# then pick it on a client: `tailscale set --exit-node=<node>`.
# Exit traffic egresses from that node's own connection / counts against it.

# vault_k3s_token -> cluster join secret (server + agents share it; always required).
# vault_wg_private_keys -> { <inventory_hostname>: <wg genkey output> } for every
#   node on the pod mesh. Public keys are non-secret and live in inventory/hosts.yml.
# The Headscale pre-auth key is used by hand in `tailscale up` on each node,
# not by Ansible - see the README.
