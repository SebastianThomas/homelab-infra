---
# Homelab cluster inventory.
#
# IP addresses / hostnames live ONLY here. Everything else refers to nodes by
# their inventory name (kube-cp-01, kube-worker-01).
#
# Hostname pattern:  kube-<role>-<number>
#   kube-cp-01       control-plane / K3s server (also runs workloads)
#   kube-worker-01   K3s agent  (optional)
#   kube-highmem-01, kube-gpu-01, ...   possible future nodes

all:
  children:

    # --- K3s server(s) -----------------------------------------------------
    # Exactly one for this setup. Uses the embedded SQLite datastore.
    k3s_cp:
      hosts:
        kube-cp-01:
          # Strato VPS.
          ansible_host: homelab.sthomas.ch
          node_ip_public: 81.169.131.24
          # Extra names baked into the API server cert - the raw Strato hostname
          # is a fallback for reaching the API if sthomas.ch DNS is ever down.
          extra_tls_san:
            - h2977839.stratoserver.net
          node_labels:
            - "{{ homelab_label_domain }}/location=strato"
          tailscale_exit_node: true
          # WireGuard pod-mesh hub. wg_ip must equal k3s_cp_wg_ip (group_vars).
          # Public key of vault_wg_private_keys['kube-cp-01'] (`wg pubkey`).
          wg_ip: "10.10.0.1"
          wg_public_key: "gpkiq4LRkOp/JCsqQqSbEumbnoa5Lv+CMyO+gCmjdiw="

    # --- K3s agents ------------------------------------------------------
    # Optional. A worker joins over the wg0 WireGuard pod mesh (keys below); it
    # also needs `tailscale up` (manual, one-time) so Ansible can reach it and
    # it can be an exit node. Full procedure: README "Adding a worker node".
    k3s_workers:
      hosts:
        kube-worker-01:
          # Raspberry Pi 4 (8 GB, arm64), Ubuntu Server, at home behind NAT and
          # its own OpenVPN. Ansible reaches it over the tailnet; its pod traffic
          # and cluster join ride the WireGuard pod-mesh link (wg0).
          ansible_host: kube-worker-01.ts.homelab.sthomas.ch
          # This node's wg0 IP (inside wg_pod_mesh_subnet). Used as node-ip so
          # the apiserver reaches the kubelet (logs / exec) over the mesh.
          node_ip: "10.10.0.2"
          wg_ip: "10.10.0.2"
          # Public key of vault_wg_private_keys['kube-worker-01'] (`wg pubkey`).
          wg_public_key: "7D6fTOvpOc+JgOGJH71IOQ9kd+EVAiM0rpoMBsNFQnw="
          # Home internet DNS, not the Strato-DC resolvers.
          k3s_resolv_conf_manage: false
          tailscale_exit_node: true
          node_labels:
            - "{{ homelab_label_domain }}/location=home"
          node_taints:
            # Nothing schedules here unless it explicitly tolerates this.
            - "{{ homelab_label_domain }}/edge=true:NoSchedule"

  vars:
    # SSH login user. Override with the ANSIBLE_SSH_USER env var (CI sets it from
    # the GitHub Environment secret of the same name). Every node must have this
    # user with NOPASSWD sudo and BOTH the CI deploy key and your own key in its
    # authorized_keys - see the README "Adding a worker node".
    ansible_user: "{{ lookup('env', 'ANSIBLE_SSH_USER') | default('sebas', true) }}"
    ansible_python_interpreter: /usr/bin/python3
