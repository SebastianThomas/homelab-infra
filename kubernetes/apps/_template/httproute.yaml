# <name>.homelab.sthomas.ch -> this app's Service, via the shared Traefik Gateway
# in kube-system (its HTTP listener accepts routes from every namespace).
# DNS: the *.homelab.sthomas.ch wildcard. TLS: host nginx (homelab-cluster cert,
# grown with `certbot ... --expand -d <name>.homelab.sthomas.ch`). See
# docs/gateway-api.md + docs/nginx-edge.md.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: myapp
  namespace: myapp
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: kube-system
  hostnames:
    - myapp.homelab.sthomas.ch
  rules:
    - backendRefs:
        - name: myapp
          port: 80
