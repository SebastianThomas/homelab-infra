# <name>.homelab.sthomas.ch -> this app's Service, via the shared Traefik Gateway
# in kube-system (listeners accept routes from every namespace; no sectionName =
# HTTP + HTTPS both). DNS: the *.homelab.sthomas.ch wildcard. TLS: the cluster
# wildcard cert `gateway-tls` (*.sthomas.ch + *.homelab.sthomas.ch) already
# covers it - nothing to do per app. A bare *.sthomas.ch name works too; add it
# as a second hostname. See docs/gateway-api.md.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: myapp
  namespace: myapp
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: kube-system
  hostnames:
    - myapp.homelab.sthomas.ch
  rules:
    - backendRefs:
        - name: myapp
          port: 80
