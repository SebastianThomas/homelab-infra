# Routes the public hostname to the app's Service. The Service itself is created
# by the app's own repo (must be named `myapp`, port 80). Until then this route
# has no backend and 404s.
#
# Attaches to the shared Traefik Gateway in kube-system (its HTTP listener
# allows routes from every namespace).
#
# DNS: covered by the *.homelab.sthomas.ch wildcard - or add
#      myapp.homelab.sthomas.ch CNAME homelab.sthomas.ch
#
# TLS is terminated by the host nginx today (nginx-edge mode); nothing to
# configure here. See docs/gateway-api.md.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: myapp
  namespace: myapp
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: kube-system
  hostnames:
    - myapp.homelab.sthomas.ch
  rules:
    - backendRefs:
        - name: myapp
          port: 80
