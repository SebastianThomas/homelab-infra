# Routes the public hostname to the app's Service. The Service itself is created
# by the app's own repo (must be named `myapp`, port 80). Until then this just
# 503s.
#
# DNS: covered by the *.homelab.sthomas.ch wildcard - or add
#      myapp.homelab.sthomas.ch CNAME homelab.sthomas.ch
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myapp
  namespace: myapp
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts: [myapp.homelab.sthomas.ch]
      secretName: myapp-tls
  rules:
    - host: myapp.homelab.sthomas.ch
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: myapp
                port:
                  number: 80
