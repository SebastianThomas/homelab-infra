apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: myapp

# Copy this whole dir into your app repo as `deploy/`, s/myapp/<name>/, and let
# homelab-actions/kube-deploy apply it (see ../README.md). homelab-infra never
# applies this.
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  # - database.yaml     # uncomment if the app needs a Postgres DB
