apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: myapp

# The PLATFORM side of an app (applied by this repo's `deploy` workflow).
# The Deployment + Service are owned by the app's own repo - see ../README.md.
resources:
  - namespace.yaml
  - rbac.yaml
  - database.yaml       # delete this line if the app has no database
  - ingress.yaml
