---
# ONE wildcard cert for the Traefik `websecure` listener (Gateway
# `traefik-gateway`, kube-system). Issued via DNS-01 / acme-dns (see
# cluster-issuer.yaml) - the only ACME method that can do wildcards.
#
# Most app hostnames are one label deep (`<app>.sthomas.ch` /
# `<app>.homelab.sthomas.ch`), so a new app is covered automatically - nothing
# to add here. An app that needs a TWO-label name (`x.y.sthomas.ch`) needs a
# `*.y.sthomas.ch` line below + one acme-dns delegation for
# `_acme-challenge.y.sthomas.ch` (see docs/gateway-api.md#tls) - a wildcard
# matches exactly one label, so `*.sthomas.ch` does NOT cover `x.y.sthomas.ch`.
#
# acme-dns keeps only the LAST 2 TXT per account, so count challenges per
# account, not per name: `sthomas.ch` (apex + `*`) is at its limit of 2 on
# f08ee2f4, and the two std-dive-logger zones share account 22f337ca - one TXT
# each, also exactly 2. Their apexes are one label deep and already covered by
# `*.sthomas.ch`, so do NOT add them here: that would put 4 challenges on
# 22f337ca and break issuance for the whole cert.
#
# This cert is for the PUBLIC edge only. Tailnet-only names
# (`*.ts.homelab.sthomas.ch`, headscale's MagicDNS base domain) are NOT here:
# they get their own cert next to the workload that serves them, in
# `infrastructure/monitoring/tailnet-certificate.yaml`. Traefik never answers on
# a tailnet name, so it has no business carrying one.
#
# Any edit below re-orders the whole cert. While a new order fails (a zone that
# is not delegated yet, or an account over the 2-TXT limit) the last good
# `gateway-tls` keeps serving but stops renewing - so delegate first, then edit.
#
# Renewal is automatic (~30d before expiry), fully hands-off.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gateway-tls
  namespace: kube-system
spec:
  secretName: gateway-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - sthomas.ch
    - "*.sthomas.ch"
    - "*.homelab.sthomas.ch"
    # std-dive-logger's ws./importer./autocomplete. backends (dev + prod).
    - "*.std-dive-logger.sthomas.ch"
    - "*.std-dive-logger-dev.sthomas.ch"
