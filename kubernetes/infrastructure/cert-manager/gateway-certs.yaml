---
# ONE wildcard cert for the Traefik `websecure` listener (Gateway
# `traefik-gateway`, kube-system). Issued via DNS-01 / acme-dns (see
# cluster-issuer.yaml) - the only ACME method that can do wildcards.
#
# Every app hostname is one label deep (`<app>.sthomas.ch` /
# `<app>.homelab.sthomas.ch`), so a new app is covered automatically - nothing
# to add here. A future app that needs a TWO-label name (`x.y.sthomas.ch`) needs
# a `*.y.sthomas.ch` line below + one acme-dns delegation for
# `_acme-challenge.y.sthomas.ch` (see docs/gateway-api.md#tls).
#
# Renewal is automatic (~30d before expiry), fully hands-off.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gateway-tls
  namespace: kube-system
spec:
  secretName: gateway-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - sthomas.ch
    - "*.sthomas.ch"
    - "*.homelab.sthomas.ch"
