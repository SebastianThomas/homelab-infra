---
# ONE wildcard cert for the Traefik `websecure` listener (Gateway
# `traefik-gateway`, kube-system). Issued via DNS-01 / acme-dns (see
# cluster-issuer.yaml) - the only ACME method that can do wildcards.
#
# A new app on `<anything>.sthomas.ch` or `<anything>.homelab.sthomas.ch` is
# covered automatically - nothing to add here. Two-label names under
# std-dive-logger are covered by their own wildcards (that app keeps a
# `*.autocomplete`-style structure; its `_acme-challenge` zones are delegated
# too). Add a `*.<newzone>.sthomas.ch` line + its acme-dns delegation only if a
# future app introduces another two-label subdomain.
#
# Renewal is automatic (~30d before expiry), fully hands-off.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gateway-tls
  namespace: kube-system
spec:
  secretName: gateway-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - sthomas.ch
    - "*.sthomas.ch"
    - "*.homelab.sthomas.ch"
    - "*.std-dive-logger-dev.sthomas.ch"
    - "*.std-dive-logger.sthomas.ch"
