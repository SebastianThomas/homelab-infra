# ACME / Let's Encrypt ClusterIssuers.
#
# Live: Traefik is the public edge and these issue the gateway certs
# (gateway-certs.yaml). The old host certbot is retired - see docs/nginx-edge.md.
#
# HTTP-01 solver uses a temporary *Ingress* - cert-manager has no stable Gateway
# API solver, and Traefik keeps its Ingress provider enabled precisely so this
# keeps working alongside our HTTPRoute-based app routes. The VPS is publicly
# reachable on :80, so no DNS API is needed. Per-host names (no wildcard -
# Strato has no ACME DNS API).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: kontakt@sthomas.ch
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
---
# Staging issuer for testing (higher rate limits, untrusted certs). Switch an
# Ingress to this with cert-manager.io/cluster-issuer: letsencrypt-staging.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: kontakt@sthomas.ch
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
