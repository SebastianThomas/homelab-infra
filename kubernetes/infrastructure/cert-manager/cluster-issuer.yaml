# ACME / Let's Encrypt ClusterIssuers.
#
# DNS-01 via acme-dns. `sthomas.ch` DNS stays at wint.global; only the
# `_acme-challenge.<zone>` names are CNAME-delegated to per-zone accounts on the
# public auth.acme-dns.io. cert-manager sets the TXT there via the acme-dns API.
# This is what lets `gateway-certs.yaml` be a single WILDCARD cert - no hostname
# list, ever.
#
# The `acme-dns` Secret (ns cert-manager, key acmedns.json) maps each delegated
# zone to its acme-dns account:
#   {
#     "sthomas.ch":                     { ...f08ee2f4... },  # apex + *.sthomas.ch (2 TXT, acme-dns keeps 2)
#     "homelab.sthomas.ch":             { ...8f234690... },
#     "std-dive-logger-dev.sthomas.ch": { ...22f337ca... },  # dev + prod share
#     "std-dive-logger.sthomas.ch":     { ...22f337ca... }   # one account (2 TXT)
#   }
# The `deploy` workflow writes it from the `ACME_DNS_JSON` Environment secret
# (see README "DNS"). Local `bootstrap.sh` runs: create the Secret by hand first.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: kontakt@sthomas.ch
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          acmeDNS:
            host: https://auth.acme-dns.io
            accountSecretRef:
              name: acme-dns
              key: acmedns.json
---
# Staging issuer for testing (higher rate limits, untrusted certs).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: kontakt@sthomas.ch
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - dns01:
          acmeDNS:
            host: https://auth.acme-dns.io
            accountSecretRef:
              name: acme-dns
              key: acmedns.json
