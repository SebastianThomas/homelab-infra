# grafana.homelab.sthomas.ch -> Grafana. Attaches to the shared Traefik Gateway
# (see docs/gateway-api.md). TLS is terminated by the host nginx today
# (nginx-edge mode) - add the vhost + cert per docs/nginx-edge.md.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: kube-system
  hostnames:
    - grafana.homelab.sthomas.ch
  rules:
    - backendRefs:
        - name: victoria-metrics-k8s-stack-grafana
          port: 80
