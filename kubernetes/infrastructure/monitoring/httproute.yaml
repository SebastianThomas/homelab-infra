# grafana.ts.homelab.sthomas.ch -> Grafana. TAILNET-ONLY: the hostname lives in
# headscale's MagicDNS base domain and is answered only inside the tailnet (an A
# record for kube-cp-01's tailnet IP in
# infrastructure/headscale/files/extra-records.json) - it does not exist in
# public DNS, and the old public `grafana.homelab.sthomas.ch` now 404s at
# Traefik.
#
# Traefik itself is still the public edge, so this is host-based hiding, not a
# separate listener: klipper SNATs every client to the node CNI address, so
# Traefik cannot tell tailnet traffic from public traffic and an IP allowlist
# would be meaningless. Grafana's own login stays the authentication boundary.
#
# Attaches to the shared Traefik Gateway (see docs/gateway-api.md); TLS is the
# cluster wildcard cert on the websecure listener - `*.ts.homelab.sthomas.ch` is
# on it (infrastructure/cert-manager/gateway-certs.yaml), nothing per-route.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: kube-system
  hostnames:
    - grafana.ts.homelab.sthomas.ch
  rules:
    - backendRefs:
        - name: victoria-metrics-k8s-stack-grafana
          port: 80
