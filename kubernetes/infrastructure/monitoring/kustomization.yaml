apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

# Two K3s HelmChart resources (metrics stack + log collector) installed by the
# in-cluster helm-controller, plus the namespace and the Grafana route.
# `grafana-admin.example.yaml` is NOT applied here - the Secret is created by
# bootstrap.sh / the deploy workflow. See README.md.
resources:
  - namespace.yaml
  - helmchart-victoria-metrics.yaml
  - helmchart-victoria-logs-collector.yaml
  - httproute.yaml
  - vmscrape-cloudnative-pg.yaml
  - vmrule-cloudnative-pg.yaml

# Dashboards the chart does not ship. The Grafana sidecar loads any ConfigMap in
# this namespace labelled grafana_dashboard=1; the name must stay stable, hence
# no hash suffix. Re-vendor with dashboards/vendor.sh.
configMapGenerator:
  - name: grafana-dashboard-cloudnative-pg
    files:
      - dashboards/cloudnative-pg.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
