# TLS front for Grafana, INSIDE the grafana-tailnet pod (see tailnet-ingress.yaml).
# Rendered into /etc/nginx/conf.d/default.conf by kustomize (hash-suffixed
# ConfigMap, so editing this file rolls the pod).
#
# It only ever sees traffic that arrived over WireGuard on the pod's own tailnet
# IP - the pod has no Service, no hostPort and no HTTPRoute, so there is no
# other way in.

# Grafana Live (dashboards, Explore tail) is a WebSocket; keep the upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name grafana.ts.homelab.sthomas.ch;

    # `grafana-ts-tls`: the *.ts.homelab.sthomas.ch cert-manager cert
    # (tailnet-certificate.yaml). cert-manager rotates the Secret in place;
    # nginx re-reads it on SIGHUP, and a pod restart is always safe.
    ssl_certificate     /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:2m;

    # Dashboard / plugin imports.
    client_max_body_size 32m;

    location / {
        # Resolved once at start-up. The Service's ClusterIP is stable across
        # chart upgrades; if the Service is ever *recreated*, restart this pod.
        proxy_pass http://victoria-metrics-k8s-stack-grafana.monitoring.svc.cluster.local:80;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }
}
