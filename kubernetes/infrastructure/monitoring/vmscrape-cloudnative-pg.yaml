---
# CNPG instance pods always serve metrics on :9187 - no Cluster config needed.
# The Cluster field `monitoring.enablePodMonitor` would create a Prometheus
# PodMonitor, whose CRD this stack does not install; VictoriaMetrics uses
# VMPodScrape. One selector covers every CNPG cluster, present and future.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: cloudnative-pg-instances
spec:
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: cloudnative-pg-operator
spec:
  namespaceSelector:
    matchNames: [cnpg-system]
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudnative-pg
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
