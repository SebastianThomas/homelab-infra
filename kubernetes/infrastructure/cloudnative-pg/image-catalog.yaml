# Vendored + trimmed from the official CloudNativePG catalog:
#   https://github.com/cloudnative-pg/artifacts/blob/dfa7bef/image-catalogs-extensions/catalog-minimal-trixie.yaml
#
# Trimmed to the two majors we care about (17 = previous, 18 = current). The
# PostgreSQL 18 `extensions` stanza makes PostGIS / pgvector / pgaudit /
# timescaledb-oss available as extension images (mounted on demand only when a
# Cluster references them - see kubernetes/apps/README.md).
#
# Image digests are kept fresh by Renovate (see .github/renovate.json5).
# `minimal` base images auto-upgrade patch releases within a major.
apiVersion: postgresql.cnpg.io/v1
kind: ClusterImageCatalog
metadata:
  name: postgresql-minimal-trixie
  labels:
    images.cnpg.io/family: postgresql
    images.cnpg.io/os: trixie
    images.cnpg.io/type: minimal
spec:
  images:
    - major: 17
      image: ghcr.io/cloudnative-pg/postgresql:17.11-202610050823-minimal-trixie@sha256:ca2c3bb893d185fe4e5d0401a010454bd87dcb67c53003c38fd828804928f5d9
    - major: 18
      image: ghcr.io/cloudnative-pg/postgresql:18.6-202610050823-minimal-trixie@sha256:37ade18dbdddba430858c72725aceeec66f33fa5333e82ea1df4942f6c1c83a3
      extensions:
        - name: pgaudit
          image:
            reference: ghcr.io/cloudnative-pg/pgaudit:18.0-202610071431-18-trixie@sha256:e83a3d45cbd76db949621cbee04d3a741c2f9b4c67e2327cd5d12c6b503d9aea
        - name: pgvector
          image:
            reference: ghcr.io/cloudnative-pg/pgvector:0.8.7-202610071437-18-trixie@sha256:41d3480fdb7b57bd90f4ba7a38f50766d4c05fd64c69bcd99f87c5bd12e753a1
        - name: postgis
          image:
            reference: ghcr.io/cloudnative-pg/postgis-extension:3.6.4-202610071454-18-trixie@sha256:eb05b5ec9ce608d7eb516b482a36d32fb32500d2f7a743255fb98760f02a3022
          ld_library_path:
            - system
          env:
            - name: GDAL_DATA
              value: ${image_root}/share/gdal
            - name: PROJ_DATA
              value: ${image_root}/share/proj
        - name: timescaledb-oss
          image:
            reference: ghcr.io/cloudnative-pg/timescaledb-oss:2.30.2-202610071445-18-trixie@sha256:54359a311beb1ed4c2dbfd2cb8bb3ab41c88a4676976236ae526d98abd6680c6
