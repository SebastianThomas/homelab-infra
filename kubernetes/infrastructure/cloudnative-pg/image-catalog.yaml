# Vendored + trimmed from the official CloudNativePG catalog:
#   https://github.com/cloudnative-pg/artifacts/blob/dfa7bef/image-catalogs-extensions/catalog-minimal-trixie.yaml
#
# Trimmed to the two majors we care about (17 = previous, 18 = current). The
# PostgreSQL 18 `extensions` stanza makes PostGIS / pgvector / pgaudit /
# timescaledb-oss available as extension images (mounted on demand only when a
# Cluster references them - see kubernetes/apps/README.md).
#
# Image digests are kept fresh by Renovate (see .github/renovate.json5).
# `minimal` base images auto-upgrade patch releases within a major.
apiVersion: postgresql.cnpg.io/v1
kind: ClusterImageCatalog
metadata:
  name: postgresql-minimal-trixie
  labels:
    images.cnpg.io/family: postgresql
    images.cnpg.io/os: trixie
    images.cnpg.io/type: minimal
spec:
  images:
    - major: 17
      image: ghcr.io/cloudnative-pg/postgresql:17.11-202611020810-minimal-trixie@sha256:7c680fc840a9ea6bd04399f1aeea06bb3180df3f0969f18833925b6df3d7dc87
    - major: 18
      image: ghcr.io/cloudnative-pg/postgresql:18.6-202610260820-minimal-trixie@sha256:64abc98a4387361afd6821a3a99f975763bbd87bbdde9449e75ad6002528a318
      extensions:
        - name: pgaudit
          image:
            reference: ghcr.io/cloudnative-pg/pgaudit:18.0-202611010824-18-trixie@sha256:c5a8cf3b27151a1ca188cf5aed297b3c0d173aa075efed9d8c2c0bf5a5e3d4ef
        - name: pgvector
          image:
            reference: ghcr.io/cloudnative-pg/pgvector:0.8.7-202611010824-18-trixie@sha256:b8ec0354be4909a2c1380ea7aaaa9f27dd8e8bb614c4687762ac052338c1e534
        - name: postgis
          image:
            reference: ghcr.io/cloudnative-pg/postgis-extension:3.6.4-202611010824-18-trixie@sha256:b756b78c475d02df560c220dbe0f915f20e4b8747813fd8e7e72840ede7c3169
          ld_library_path:
            - system
          env:
            - name: GDAL_DATA
              value: ${image_root}/share/gdal
            - name: PROJ_DATA
              value: ${image_root}/share/proj
        - name: timescaledb-oss
          image:
            reference: ghcr.io/cloudnative-pg/timescaledb-oss:2.31.0-202611010824-18-trixie@sha256:16ed4ddbaa80af73cb7a3d996d922b1a8b9a6add11dbf6cf6cd4046bfc5c0e7d
