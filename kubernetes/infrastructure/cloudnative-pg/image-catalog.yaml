# Vendored + trimmed from the official CloudNativePG catalog:
#   https://github.com/cloudnative-pg/artifacts/blob/dfa7bef/image-catalogs-extensions/catalog-minimal-trixie.yaml
#
# Trimmed to the two majors we care about (17 = previous, 18 = current). The
# PostgreSQL 18 `extensions` stanza makes PostGIS / pgvector / pgaudit /
# timescaledb-oss available as extension images (mounted on demand only when a
# Cluster references them - see kubernetes/apps/README.md).
#
# Image digests are kept fresh by Renovate (see .github/renovate.json5).
# `minimal` base images auto-upgrade patch releases within a major.
apiVersion: postgresql.cnpg.io/v1
kind: ClusterImageCatalog
metadata:
  name: postgresql-minimal-trixie
  labels:
    images.cnpg.io/family: postgresql
    images.cnpg.io/os: trixie
    images.cnpg.io/type: minimal
spec:
  images:
    - major: 17
      image: ghcr.io/cloudnative-pg/postgresql:17.11-202609140816-minimal-trixie@sha256:25d78329e192884180f490dc5b64dc4485d3e8c1d21c09ec0c4301ac08d6a3aa
    - major: 18
      image: ghcr.io/cloudnative-pg/postgresql:18.6-202609140816-minimal-trixie@sha256:eb5e64f585627b5356c2a558389c85677f7174451a0b38b616ca96e4bfa666e2
      extensions:
        - name: pgaudit
          image:
            reference: ghcr.io/cloudnative-pg/pgaudit:18.0-202609161208-18-trixie@sha256:af4c04ad9a88385b5a6a858f8cef627a6326c0efa10a7590797adda229aa7535
        - name: pgvector
          image:
            reference: ghcr.io/cloudnative-pg/pgvector:0.8.6-202609161208-18-trixie@sha256:d518480f927c790aefb12b3af8d3641f0ef06284262dc94a9f89cc89b4b86fb5
        - name: postgis
          image:
            reference: ghcr.io/cloudnative-pg/postgis-extension:3.6.4-202609161208-18-trixie@sha256:29b82847424cb36ffc590c200d98fd3eb1706c757299092163aba0d7f807517e
          ld_library_path:
            - system
          env:
            - name: GDAL_DATA
              value: ${image_root}/share/gdal
            - name: PROJ_DATA
              value: ${image_root}/share/proj
        - name: timescaledb-oss
          image:
            reference: ghcr.io/cloudnative-pg/timescaledb-oss:2.30.0-202609161208-18-trixie@sha256:f315524ba7a4b2885950207e12bca0a712d9b54ca81b0b3a93d05bd43601f576
