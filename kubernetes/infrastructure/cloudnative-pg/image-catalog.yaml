# Vendored + trimmed from the official CloudNativePG catalog:
#   https://github.com/cloudnative-pg/artifacts/blob/dfa7bef/image-catalogs-extensions/catalog-minimal-trixie.yaml
#
# Trimmed to the two majors we care about (17 = previous, 18 = current). The
# PostgreSQL 18 `extensions` stanza makes PostGIS / pgvector / pgaudit /
# timescaledb-oss available as extension images (mounted on demand only when a
# Cluster references them - see kubernetes/apps/README.md).
#
# Image digests are kept fresh by Renovate (see .github/renovate.json5).
# `minimal` base images auto-upgrade patch releases within a major.
apiVersion: postgresql.cnpg.io/v1
kind: ClusterImageCatalog
metadata:
  name: postgresql-minimal-trixie
  labels:
    images.cnpg.io/family: postgresql
    images.cnpg.io/os: trixie
    images.cnpg.io/type: minimal
spec:
  images:
    - major: 17
      image: ghcr.io/cloudnative-pg/postgresql:17.12-202611230809-minimal-trixie@sha256:c6fba114bd9901f65d4ccfc2e0c6fb252ab134b775d7cbad1393fa1775e3a497
    - major: 18
      image: ghcr.io/cloudnative-pg/postgresql:18.7-202611230809-minimal-trixie@sha256:c8caac9817d2b5e5e66297a3ccf86d9fcbd68f097aa6cc00161d83f9635e88cc
      extensions:
        - name: pgaudit
          image:
            reference: ghcr.io/cloudnative-pg/pgaudit:18.1-202611251238-18-trixie@sha256:6c64b0c731e55d79ebca58465062922648a928016988b589018c2cbfc693ced6
        - name: pgvector
          image:
            reference: ghcr.io/cloudnative-pg/pgvector:0.8.7-202611251238-18-trixie@sha256:fcf61ee830ca63461f3caaa7d4b0982591ed9ccdc51ad11a7c17a57195f8d0d1
        - name: postgis
          image:
            reference: ghcr.io/cloudnative-pg/postgis-extension:3.7.0-202611251238-18-trixie@sha256:326fdac46af44202e7724ed2a3b16d6b52484715bbe4908774dcbcb1ec917a64
          ld_library_path:
            - system
          env:
            - name: GDAL_DATA
              value: ${image_root}/share/gdal
            - name: PROJ_DATA
              value: ${image_root}/share/proj
        - name: timescaledb-oss
          image:
            reference: ghcr.io/cloudnative-pg/timescaledb-oss:2.32.0-202611251238-18-trixie@sha256:724fdbe39a7cd4a18862ccc316ecc442c079ac4e6daff8a32556948f15904c49
