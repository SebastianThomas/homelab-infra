# Tunes the Traefik that K3s bundles (do not `disable: traefik` - this layers
# on top). K3s's helm-controller merges this with the packaged values.
#
# ─────────────────────────────────────────────────────────────────────────────
# ROUTING: Gateway API. Traefik v3 is a native Gateway controller; the Gateway
# API CRDs (v1.5.1, standard channel) are already installed by K3s's own
# `traefik-crd` release and version-locked to this Traefik. We just turn the
# provider on, and the chart creates:
#   - GatewayClass  "traefik"          (controller traefik.io/gateway-controller)
#   - Gateway       "traefik-gateway"  in kube-system, listeners web (:8000 HTTP)
#                                       and websecure (:8443 HTTPS)
# App routes are `HTTPRoute` objects in the app's namespace with
#   parentRefs: [{ name: traefik-gateway, namespace: kube-system }]
# (the listeners allow routes from every namespace; a route with no sectionName
# attaches to both, so HTTP+HTTPS work with no per-route TLS config).
#
# EDGE: Traefik is the public edge. `service.spec.type: LoadBalancer` -> K3s
# ServiceLB (klipper) binds the host's :80/:443 to this Service. TLS terminates
# here with a single cert-manager DNS-01 WILDCARD cert (`gateway-tls`, see
# infrastructure/cert-manager/) - a new app hostname needs no change here. HTTP
# redirects to HTTPS at the `web` entrypoint (`ports.web.redirectTo`).
# History (host nginx + certbot as edge, and the flip): docs/nginx-edge.md.
#
# NOTE: the Traefik chart (v40) renders the Service spec straight from
# `service.spec` - a top-level `service.type` is silently ignored. And do NOT
# set `ports.web.hostIP`: the chart threads it into the entrypoint listen
# address, so Traefik binds the pod's own loopback and nothing can reach it.
#
# Gateway API notes: docs/gateway-api.md
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    service:
      spec:
        # Traefik is the public edge (host nginx retired). type: LoadBalancer
        # -> K3s ServiceLB (klipper) binds the host's :80/:443 to this Service.
        type: LoadBalancer
        # clusterIP kept pinned - harmless under LoadBalancer, and survives a
        # svc recreate. (Was nginx's proxy_pass target before the flip.)
        clusterIP: "10.43.66.94"

    # Gateway API provider (Traefik's Ingress provider stays on too - cert-manager
    # still solves HTTP-01 with a temporary Ingress).
    providers:
      kubernetesGateway:
        enabled: true
    gatewayClass:
      enabled: true
    gateway:
      enabled: true
      listeners:
        web:
          port: 8000            # must match ports.web.port (the `web` entrypoint)
          protocol: HTTP
          # Let HTTPRoutes in any namespace (headscale/, apps/*) attach.
          namespacePolicy:
            from: All
        websecure:
          port: 8443            # the `websecure` entrypoint
          protocol: HTTPS
          namespacePolicy:
            from: All
          # `gateway-tls` is one DNS-01 WILDCARD cert covering *.sthomas.ch,
          # *.homelab.sthomas.ch, etc. (cert-manager + acme-dns - see
          # infrastructure/cert-manager/). A new app hostname is covered
          # automatically, no change here. The old per-name gateway-tls-homelab
          # / gateway-tls-public secrets are kept only until the wildcard is
          # confirmed live, then dropped (their Certificates are already gone).
          certificateRefs:
            - name: gateway-tls
            - name: gateway-tls-homelab
            - name: gateway-tls-public

    ports:
      web:
        # Public HTTP -> redirect to HTTPS at the entrypoint (before routing).
        redirectTo:
          port: websecure
        # klipper's svclb SNATs client connections to the node CNI address -
        # trust that range for X-Forwarded-* / X-Real-IP (otherwise Headscale
        # logs every client as the node IP).
        forwardedHeaders:
          trustedIPs:
            - 10.42.0.0/16
        # Headscale's control protocol is a long-lived POST that upgrades the
        # connection - disable the responding timeouts.
        transport:
          respondingTimeouts:
            readTimeout: 0
            writeTimeout: 0
            idleTimeout: 0
      websecure:
        transport:
          respondingTimeouts:
            readTimeout: 0
            writeTimeout: 0
            idleTimeout: 0
