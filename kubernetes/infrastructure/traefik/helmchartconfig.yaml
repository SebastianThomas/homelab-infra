# Tunes the Traefik that K3s bundles (do not `disable: traefik` - this layers
# on top). K3s's helm-controller merges this with the packaged values.
#
# ─────────────────────────────────────────────────────────────────────────────
# ROUTING: Gateway API. Traefik v3 is a native Gateway controller; the Gateway
# API CRDs (v1.5.1, standard channel) are already installed by K3s's own
# `traefik-crd` release and version-locked to this Traefik. We just turn the
# provider on, and the chart creates:
#   - GatewayClass  "traefik"          (controller traefik.io/gateway-controller)
#   - Gateway       "traefik-gateway"  in kube-system, one HTTP listener (:8000)
# App routes are `HTTPRoute` objects in the app's namespace with
#   parentRefs: [{ name: traefik-gateway, namespace: kube-system }]
# (the listener allows routes from every namespace).
#
# EDGE: nginx is the public edge. The Strato VM already runs nginx + certbot for
# a dozen *.sthomas.ch sites (proxying to local docker-compose apps), so Traefik
# is NOT public here:
#
#   service.spec.type: ClusterIP  -> K3s ServiceLB (klipper) stops DNAT'ing the
#                                    host's :80/:443, leaving them to nginx.
#   service.spec.clusterIP pinned -> nginx has a stable address to proxy to.
#
# nginx then reverse-proxies *.homelab.sthomas.ch -> http://10.43.66.94:80.
#
# NOTE: the Traefik chart (v40) renders the Service spec straight from
# `service.spec` - a top-level `service.type` is silently ignored. And do NOT
# set `ports.web.hostIP`: the chart threads it into the entrypoint listen
# address, so Traefik binds the pod's own loopback and nothing can reach it.
#
# Full picture + the nginx vhost + the "flip to Traefik-as-edge" checklist:
#   docs/nginx-edge.md ; Gateway API notes: docs/gateway-api.md
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    service:
      spec:
        type: ClusterIP
        # Pinned so nginx's proxy_pass target never moves. This is the address
        # K3s already allocated; keeping it explicit survives a svc recreate.
        clusterIP: "10.43.66.94"

    # Gateway API provider (Traefik's Ingress provider stays on too - cert-manager
    # still solves HTTP-01 with a temporary Ingress).
    providers:
      kubernetesGateway:
        enabled: true
    gatewayClass:
      enabled: true
    gateway:
      enabled: true
      listeners:
        web:
          port: 8000            # must match ports.web.port (the `web` entrypoint)
          protocol: HTTP
          # Let HTTPRoutes in any namespace (headscale/, apps/*) attach.
          namespacePolicy:
            from: All

    ports:
      web:
        # nginx reaches Traefik via the ClusterIP, so the connection is SNAT'd
        # to the node's CNI address - trust that range for X-Forwarded-* /
        # X-Real-IP (otherwise Headscale logs every client as the node IP).
        forwardedHeaders:
          trustedIPs:
            - 10.42.0.0/16
        # Headscale's control protocol is a long-lived POST that upgrades the
        # connection - disable the responding timeouts.
        transport:
          respondingTimeouts:
            readTimeout: 0
            writeTimeout: 0
            idleTimeout: 0
      websecure:
        transport:
          respondingTimeouts:
            readTimeout: 0
            writeTimeout: 0
            idleTimeout: 0
