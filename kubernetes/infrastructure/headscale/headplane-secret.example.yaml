# TEMPLATE - the real Secret is created out of band, never committed.
#
# CI (deploy.yml) creates it from the GitHub Environment secrets
# HEADPLANE_COOKIE_SECRET and HEADPLANE_API_KEY.
#
# Locally:
#   COOKIE=$(openssl rand -hex 16)
#   API_KEY=$(kubectl -n headscale exec deploy/headscale -- \
#              headscale apikeys create --expiration 8760h | tail -1)
#   kubectl -n headscale create secret generic headplane-secret \
#     --from-literal=cookie_secret="$COOKIE" \
#     --from-literal=api_key="$API_KEY" \
#     --dry-run=client -o yaml | kubectl apply -f -
#   kubectl -n headscale rollout restart deploy/headplane
#
apiVersion: v1
kind: Secret
metadata:
  name: headplane-secret
  namespace: headscale
type: Opaque
stringData:
  cookie_secret: "REPLACE_ME_openssl_rand_hex_16_32chars"
  api_key: "REPLACE_ME_headscale_apikeys_create"
