apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: headplane-data
  namespace: headscale
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headplane
  namespace: headscale
  labels:
    app.kubernetes.io/name: headplane
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: headplane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: headplane
    spec:
      containers:
        - name: headplane
          image: ghcr.io/tale/headplane:0.7.1
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            exec:
              command: ["/bin/hp_healthcheck"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["/bin/hp_healthcheck"]
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/headplane
              readOnly: true
            - name: headscale-config
              mountPath: /etc/headscale
              readOnly: true
            - name: secrets
              mountPath: /etc/headplane/secrets
              readOnly: true
            - name: data
              mountPath: /var/lib/headplane
      volumes:
        - name: config
          configMap:
            name: headplane-config
            items:
              - key: config.yaml
                path: config.yaml
        - name: headscale-config
          configMap:
            name: headscale-config
            items:
              - key: config.yaml
                path: config.yaml
        - name: secrets
          secret:
            secretName: headplane-secret
        - name: data
          persistentVolumeClaim:
            claimName: headplane-data
