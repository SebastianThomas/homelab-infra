apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headscale
  namespace: headscale
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - headscale.homelab.sthomas.ch
      secretName: headscale-tls
  rules:
    - host: headscale.homelab.sthomas.ch
      http:
        paths:
          # Headplane admin UI (fixed path, no rewrite).
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: headplane
                port:
                  number: 3000
          # Everything else is the headscale control protocol + API.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: headscale
                port:
                  number: 8080
