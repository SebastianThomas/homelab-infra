# Rate limits for headscale.homelab.sthomas.ch (see httproute.yaml). Bucketed
# by real client IP via the entrypoint's trusted forwarded headers, not
# klipper's SNAT address.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: headplane-ratelimit
  namespace: headscale
spec:
  rateLimit:
    average: 10 # /admin has no OIDC/MFA - tight budget against brute force
    period: 1m
    burst: 20
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: headscale-ratelimit
  namespace: headscale
spec:
  rateLimit:
    average: 100 # generous - real nodes hold long-lived connections
    period: 1m
    burst: 200
