# Gateway API route for headscale + Headplane. Attaches to the shared Traefik
# Gateway in kube-system (its HTTP listener allows routes from all namespaces).
#
# TLS is terminated upstream by the host nginx (nginx-edge mode), so there is no
# TLS config here. When the cluster becomes the public edge, TLS moves onto the
# Gateway listener - see docs/gateway-api.md and docs/nginx-edge.md.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headscale
  namespace: headscale
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: kube-system
  hostnames:
    - headscale.homelab.sthomas.ch
  rules:
    # Headplane admin UI (more specific path wins regardless of rule order).
    - matches:
        - path:
            type: PathPrefix
            value: /admin
      backendRefs:
        - name: headplane
          port: 3000
    # Everything else is the headscale control protocol + API.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: headscale
          port: 8080
