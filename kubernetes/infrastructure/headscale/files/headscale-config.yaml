# Managed in git - kubernetes/infrastructure/headscale/files/headscale-config.yaml
# Rendered into the `headscale-config` ConfigMap by kustomize (hash-suffixed, so
# editing this file rolls the deployment automatically).
# Schema: headscale v0.29.x  (https://github.com/juanfont/headscale/blob/v0.29.3/config-example.yaml)

server_url: https://headscale.homelab.sthomas.ch
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 0.0.0.0:9090
grpc_listen_addr: 127.0.0.1:50443
grpc_allow_insecure: false

# Traefik pods (K3s default pod CIDR) are the only trusted source of
# X-Forwarded-For / X-Real-IP / True-Client-IP.
trusted_proxies:
  - 10.42.0.0/16

noise:
  private_key_path: /var/lib/headscale/noise_private.key

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

# No embedded DERP: NAT-traversal fallback goes through Tailscale's public
# relays. Enable the embedded server later only if you need full self-hosting
# (it then needs a public UDP 3478 LoadBalancer).
derp:
  server:
    enabled: false
  urls:
    - https://controlplane.tailscale.com/derpmap/default
  paths: []
  auto_update_enabled: true
  update_frequency: 24h

disable_check_updates: true

node:
  expiry: 0
  ephemeral:
    inactivity_timeout: 30m

database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite
    write_ahead_log: true
    wal_autocheckpoint: 1000

# TLS terminated at Traefik; headscale serves plain HTTP on :8080.
acme_email: ""
tls_letsencrypt_hostname: ""
tls_cert_path: ""
tls_key_path: ""

log:
  level: info
  format: json

# ACLs live in the database, managed via the API / Headplane.
policy:
  mode: database

dns:
  magic_dns: true
  # MUST differ from the server_url domain. Not resolved publicly - MagicDNS
  # answers it inside the tailnet.
  base_domain: ts.homelab.sthomas.ch
  override_local_dns: true
  nameservers:
    global:
      - 1.1.1.1
      - 1.0.0.1
    split: {}
  search_domains: []
  # Static tailnet A/AAAA records, kept in git (files/extra-records.json).
  extra_records_path: /config/extra-records.json

unix_socket: /var/run/headscale/headscale.sock
unix_socket_permission: "0770"

logtail:
  enabled: false
