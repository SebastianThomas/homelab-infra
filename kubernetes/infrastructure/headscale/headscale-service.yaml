apiVersion: v1
kind: Service
metadata:
  name: headscale
  namespace: headscale
  labels:
    app.kubernetes.io/name: headscale
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: headscale
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: metrics
      port: 9090
      targetPort: metrics
---
# Prometheus scrape config. Apply only if you run the Prometheus Operator
# (kube-prometheus-stack) - otherwise the CRD is missing and this is skipped.
# Uncomment together with a monitoring stack.
#
# apiVersion: monitoring.coreos.com/v1
# kind: ServiceMonitor
# metadata:
#   name: headscale
#   namespace: headscale
#   labels:
#     app.kubernetes.io/name: headscale
# spec:
#   selector:
#     matchLabels:
#       app.kubernetes.io/name: headscale
#   endpoints:
#     - port: metrics
#       path: /metrics
