apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: headscale

resources:
  - namespace.yaml
  - headscale-deployment.yaml
  - headscale-service.yaml
  - headplane-deployment.yaml
  - headplane-service.yaml
  - httproute.yaml

# Node pinning: via the namespace annotation in namespace.yaml.

configMapGenerator:
  - name: headscale-config
    files:
      - config.yaml=files/headscale-config.yaml
  - name: headscale-dns
    files:
      - extra-records.json=files/extra-records.json
  - name: headplane-config
    files:
      - config.yaml=files/headplane-config.yaml

# headplane-secret is created out of band (see headplane-secret.example.yaml) -
# not managed here.
